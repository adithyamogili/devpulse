name: devpulse
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devpulse}
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      kafka: { condition: service_healthy }
    command: ["python", "-m", "devpulse.cli", "--help"]
    restart: "no"

  kafka-consumer:
    build: .
    env_file: .env
    command: ["python", "-m", "devpulse.consumer"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://devpulse:devpulse@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: devpulse-local-secret
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username airflow --password airflow --firstname Dev --lastname Pulse --role Admin --email airflow@example.com || true"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://devpulse:devpulse@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: devpulse-local-secret
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    command: webserver
    ports: ["8080:8080"]
    volumes: ["./airflow/dags:/opt/airflow/dags"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://devpulse:devpulse@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: devpulse-local-secret
    command: scheduler
    volumes: ["./airflow/dags:/opt/airflow/dags", "./devpulse:/opt/airflow/devpulse"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  spark-submit:
    image: apache/spark:3.5.5
    user: "0:0"
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    volumes: ["./spark/jobs:/opt/spark/jobs"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[*]"
      - "--packages"
      - "org.postgresql:postgresql:42.7.5"
      - "/opt/spark/jobs/bronze_to_silver.py"
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["jobs"]

  dbt:
    build: .
    env_file: .env
    working_dir: /opt/devpulse/dbt
    volumes: ["./dbt:/opt/devpulse/dbt"]
    command: ["bash", "-lc", "pip install --no-cache-dir dbt-core==1.9.2 dbt-postgres==1.9.0 && dbt build --profiles-dir ."]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["jobs"]

  dashboard:
    build: .
    env_file: .env
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  kafka_data:
